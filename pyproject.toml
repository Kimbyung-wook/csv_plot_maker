[project]
name = "csv-plot-maker"
version = "0.1.0"
description = "CSV data plotting desktop tool with configurable subplots, dynamic line styles, and dual Y-axes"
requires-python = ">=3.10"
dependencies = [
    "pyside6>=6.7",
    "pyqtgraph>=0.13",
    "polars>=1.0",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csv_plot_maker"]

[project.scripts]
csv-plot-maker = "csv_plot_maker.main:main"
